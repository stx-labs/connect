name: "check-code"
description: "run linting, type checking, and tests"

runs:
  using: "composite"
  steps:
    - run: npm run lint
      shell: bash
    - run: npm run types
      shell: bash
    - run: npm run typecheck
      shell: bash
    - run: npm run typecheck:test
      shell: bash
    - run: npm run test
      shell: bash
